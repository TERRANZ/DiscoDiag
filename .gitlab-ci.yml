image: 192.168.3.1:5000/vterranz/discobuild

before_script:
  - export DOCKER_HOST=http://192.168.1.3:2375
  - export http_proxy=socks5h://192.168.3.1:10001
  - export https_proxy=socks5h://192.168.3.1:10001

stages:
  - build
  - test
  - review

build:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j"$(nproc)"
  artifacts:
    paths:
      - build

test:
  stage: test
  needs:
    - build
  script:
    - ctest --test-dir build --output-on-failure

ai-review:
  stage: review
  image: nikitafilonov/ai-review:latest
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual
  script:
    - ai-review run
  variables:
    # --- Mandatory ---
    GIT_DEPTH: "0"

    # --- LLM configuration ---
    LLM__PROVIDER: "OPENAI"
    LLM__META__MODEL: "gpt-4o-mini"
    LLM__META__MAX_TOKENS: "15000"
    LLM__META__TEMPERATURE: "0.3"
    LLM__HTTP_CLIENT__API_URL: "$LLM_API_URL"
    LLM__HTTP_CLIENT__API_TOKEN: "test"

    # --- GitLab integration ---
    VCS__PROVIDER: "GITLAB"
    VCS__PIPELINE__PROJECT_ID: "$CI_PROJECT_ID"
    VCS__PIPELINE__MERGE_REQUEST_ID: "$CI_MERGE_REQUEST_IID"
    VCS__HTTP_CLIENT__API_URL: "$CI_SERVER_URL"
    VCS__HTTP_CLIENT__PROXY_URL: "$VCS_PROXY"
    VCS__HTTP_CLIENT__API_TOKEN: "$AI_REVIEW_TOKEN"
  allow_failure: true  # Optional: don't block pipeline if AI review fails

